# Wiederkehrende Veranstaltungen
#
# Aufbau eines Eintrags:
#   name        Name der Veranstaltung
#   ort         Ort
#   link        allgemeine Seite des Veranstalters (nicht die eines bestimmten Jahres)
#   monat       üblicher Monat (zum Sortieren)
#   rhythmus    jährlich | gerade Jahre | ungerade Jahre | einmalig | unklar
#   regel       feste Regel, nach der sich das Datum berechnen lässt (falls es eine gibt)
#   ungefähr    grobe Lage, wenn es keine feste Regel gibt
#   pruefen_ab  ab welchem Monat man nach dem neuen Termin schauen sollte
#   notiz       offene Fragen, Hinweise
#   termine     pro Jahr:
#                 von / bis   Datum (JJJJ-MM-TT)
#                 status      bestätigt  = vom Veranstalter veröffentlicht
#                             berechnet  = aus der Regel abgeleitet, noch nicht offiziell
#                             geschätzt  = nur grob aus den Vorjahren abgeleitet
#                             offen      = noch nichts bekannt
#                             entfällt   = findet in diesem Jahr nicht statt
#                 quelle      woher die Angabe stammt
#
# Aus dieser Datei erzeugt kalender.py die Kalenderdateien (.ics).

